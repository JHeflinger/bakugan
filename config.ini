# A typical run on a server with no GPU: a longer search, fixed seed, everything written for later inspection.
# Run it with:   foldaball optimize bunny.obj -c server.example.ini -o results/bunny
# Anything not listed here keeps the editor's default. `foldaball config` prints every setting.

[input]
mesh_size = 80            # centre the mesh and scale its longest side to 80 mm

[optimizer]
steps = 6000
seed = 7

[goal]
views = 8
view_pixels = 96
dependencies = true       # hinges hold each other shut

[finishing]
build_hinges = true
carve_when_done = true

[output]
preview = true            # <name>.png: open, closing, closed
checkpoint_seconds = 300  # <name>.partial.txt: the best so far, every 5 minutes
stl = false               # true: also export STL parts (slow at fine voxel sizes)

[runtime]
threads = 0               # 0: every core
progress_seconds = 30

[suite]
video = false             # no ffmpeg needed; designs, pictures and summary.csv are still written
