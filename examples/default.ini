# foldball settings. Lines starting with # are comments; a missing line keeps the default.

[model]
# The sphere's diameter, mm (the hinges' and clearances' mm are measured against it).
size_mm = 60
# No more bodies than this.
max_bodies = 64
# No more hollows (capsules carved from the sphere) than this.
max_hollows = 64
# Lattice points across the sphere for collisions, holding and one piece.
samples = 24

[optimizer]
# Adam steps (rewrite lookaheads count too).
steps = 10000
# Random seed.
seed = 1
# Worker threads (0: every core).
threads = 0
# Cut plane step (radians / sphere radii).
lr_plane = 0.01
# Hinge position along its seam, step (radians).
lr_phi = 0.03
# Hinge opening angle step (radians).
lr_angle = 0.05
# Hollow step (sphere radii).
lr_hollow = 0.01
# Where the open pose sits against the mesh (its scale and offset), step.
lr_place = 0.01
# Adam steps between rewrite rounds.
steps_per_round = 30
# Rewrites tried each round (0: no grammar).
rewrites_per_round = 4
# Adam steps each try gets before they are compared.
lookahead = 20
# A rewrite is kept when it is no worse than leaving the design alone by more than this share.
rewrite_margin = 0.01

[loss]
# Views of the open pose.
views = 12
# Pixels across each view.
view_pixels = 72
# How each view of the open pose is compared with the mesh's: 0 silhouettes (outlines only); 1 silhouettes, plus how far apart the front surfaces are where both cover a pixel (depth_weight); 2 depth rasters: each view as a picture of nearness (nearer brighter, nothing black), compared pixel by pixel, so outline and depth are one comparison.
fit_look = 1
# fit_look 1: the depth comparison's weight on top of the silhouettes (3D shape, not just outline).
depth_weight = 1
# Soft edge of the silhouettes, pixels.
softness = 0.75
# Hollows carving into the sphere's surface (it should stay a sphere to roll).
surface_weight = 1

[constraints]
# Bodies overlapping, open and along the motion.
collision_weight = 1
# The collision weight grows to this many times itself over the run.
collision_ramp = 10
# Poses checked in each hinge's turn (a fixed number per turn: a faster turn doesn't escape them).
checks_per_hinge = 4
# A hinge's barrel must have both of its bodies right at it (where along its seam both are).
hinge_weight = 1
# Hinge barrel length, as a share of the sphere's radius.
hinge_length = 0.3
# Every hinge but the root next to a piece opening before it (so a ledge can hold it).
dependency_weight = 0.1
# Material of a body apart from the rest of it.
one_piece_weight = 5
# Re-sort the opening order (least colliding first) this often, if it helps.
reorder_every = 60

[grammar]
# Split: a body cut in two by a plane, a hinge on the seam at angle 0.
split = 1
# Merge: a hinge that hardly turns is removed, its two bodies made one.
merge = 0.4
# Join: a negligible body becomes part of its parent; what hung from it is re-hung there, turned as nearly as before.
join = 0.4
# Carve: a hollow starts (at nothing) where the open pose shows material the mesh doesn't have.
carve = 0.4
# Uncarve: a hollow is removed.
uncarve = 0.2
# A hinge turning less than this may be merged.
merge_angle_deg = 4
# A body with less than this share of the volume may be joined into its parent.
join_share = 0.02

[semantic]
# Every few rounds, deform the input pose (ARAP) toward the design, kept when it helps and stays the same shape.
enabled = true
# Steps between semantic deformations.
every = 1001
# ARAP rounds per deformation.
iterations = 6
# The input is simplified to about this many vertices for ARAP.
arap_vertices = 1500
# How far toward the design each round pulls the input.
step = 0.5
# Most local stretch (not explained by rotation) a deformation may have.
max_strain = 0.497619
# Most volume change a deformation may have.
max_volume_change = 0.497619

[post]
# Add ledges so every hinge is held by one that opens before it.
ledges = true
# Carve leftover collisions away (smoothly).
carve = true
# A press latch on the root hinge, flush with the sphere.
latch = true
# Build the hinges (knuckles and a pin).
hinges = true
# Remove any part of a body apart from the rest of it.
fragments = true
# Restore the input's features onto the parts it opens into (where they don't collide; see the feature_ settings).
features = true
# Feature restoration: grid points across the sphere (finer features, more memory and time).
feature_resolution = 192
# Feature restoration: how far (mm) the restored surface may lie from the part's, in or out; farther apart, the part is left as it is.
feature_reach_mm = 3
# Feature restoration: where a feature would stick out into another part (or past the sphere), how much it is flattened (0: full height, 1: flat).
feature_flatten = 0.75
# Feature restoration: what still sticks out after flattening: 0 squared off flush, 1 sunk whole into a recess (so the sphere keeps the feature's shape as a texture).
feature_sink = 0.5
# Feature restoration: how far around a sunk feature the recess reaches, mm (and the flattened zone around a feature that doesn't fit).
feature_sink_mm = 1.5
# Gap between parts that move against each other, mm.
clearance_mm = 0.4
# Hinge knuckle radius, mm: also how deep under the surface the hinges sit.
knuckle_radius_mm = 2
# Hinge pin radius, mm.
pin_radius_mm = 0.9
# Ledge size, mm.
ledge_mm = 2
# Poses per hinge turn the carving looks at.
carve_checks = 24
# Grid points across the sphere for the carving.
carve_resolution = 96

[export]
# Voxels across the sphere when meshing for STL.
stl_resolution = 220
# 0: the open pose, 1: closed.
stl_pose = 0

[output]
# Where runs write their results.
dir = foldball_out
# Status file and line this often.
status_seconds = 2
# Best design so far saved this often (0: never).
snapshot_seconds = 30

[suite]
# Test suite: video frames of each mesh's optimization (the best design so far, at evenly spaced steps).
frames = 120
# Test suite: then frames of the result folding shut and opening again (0: none).
fold_frames = 72
# Test suite: pixels across each mesh's square in the video.
tile = 360
# Test suite: the video's frames per second.
fps = 30
# Test suite: post process each result (as [post] says) before it folds in the video, and save it built.
post = false
# Test suite: show the target mesh faintly over the design in the video.
ghost = true
