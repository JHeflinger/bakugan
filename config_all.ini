# foldaball settings. Written by `foldaball config`: every setting, at its current value.
# Lines starting with # or ; are comments. Delete any line to keep the editor's default for it.
# Paths are relative to the directory foldaball is run from.

[input]

# The .obj to fit (optimize, score). Can also be given on the command line.
# (text)
mesh = 

# Centre the mesh and scale its longest side to this many mm before fitting. 0 leaves it as the file has it.
# (0..100000; 0 = as is)
mesh_size = 0

[output]

# Where the results go. Empty: ./foldaball_out (optimize, score) or <suite folder>/autodesign_suite.
# (text)
dir = 

# File name stem of the results. Empty: the mesh's own.
# (text)
name = 

# Write <name>.png: the result open, a third and two thirds closed, and closed (software rendered).
# (true | false)
preview = true

# Pixels across each pose in that picture.
# (64..2048)
preview_size = 360

# Write <name>.views.png: the silhouettes scored last, against the placed mesh's (as in the Generate tab).
# (true | false)
views_image = true

# Write <name>.history.csv: the loss at every step of the run.
# (true | false)
history = true

# Save the best design so far to <name>.partial.txt this often, so a killed run loses little. 0: never.
# (0..86400)
checkpoint_seconds = 60

# Also export the result as STL parts (<name>_<pose>_<part>.stl). Slow for fine voxels.
# (true | false)
stl = false

# The pose the STL parts are exported in.
# (open | closed | design)
stl_pose = open

# STL mesh voxel size, mm: smaller is finer and much slower.
# (0.02..5)
stl_voxel = 0.2

# OpenVDB mesh simplification for the STL parts.
# (0..1)
stl_adaptivity = 0.1

# One STL per part.
# (true | false)
stl_separate = true

# One STL with every part together (print in place).
# (true | false)
stl_combined = false

# Trim bodies that touch in the export pose, so parts printed together come out apart.
# (true | false)
stl_keep_apart = true

# ... to this gap, mm.
# (0..5)
stl_gap = 0.4

[runtime]

# Worker threads for the search (0: every core).
# (0..4096)
threads = 0

# Print a progress line this often (0: none).
# (0..86400)
progress_seconds = 10

[goal]

# Directions the outlines are compared from, spread over a half sphere. (The slider: 1..16)
# (1..64)
views = 6

# Pixels across each view: finer is more exact and slower. (The slider: 32..192)
# (8..1024)
view_pixels = 64

# Share of every view's target outline the design must cover; each view short of it costs steeply.
# (0..1)
min_view_coverage = 0.6

# What pieces overlapping each other costs, in the open pose and in every hinge's turn.
# (0..1000; 0 = ignored)
collision_weight = 1

# Overlaps cost this many times as much by the end of the search as at its start, rising steadily. 1: the same throughout.
# (1..10000)
collision_ramp = 20

# Poses checked for overlaps in every hinge's turn, spread evenly over its angle.
# (1..256)
hinge_checks = 6

# Hinges open one after another, the freest first. Off: each hinge's timing is tuned by Adam.
# (true | false)
order_hinges = true

# Every hinge but the first to open is held shut by a piece that moves away first (implies order_hinges).
# (true | false)
dependencies = false

# What a hinge with nothing near enough to hold it costs.
# (0..1000)
dependency_weight = 1

# mm a ledge reaches over the piece it holds (dependencies).
# (0..1000; 0 = auto: 12% of the sphere's radius)
ledge_size = 0

# mm of another piece's surface a ledge may cross to get there (dependencies).
# (0..1000; 0 = auto: 35% of the radius)
ledge_reach = 0

# What a hinge being away from the two pieces it joins costs. It is also what limits the search most.
# (0..1000; 0 = ignored)
hinge_weight = 2

# What hollows carving into the sphere's surface cost.
# (0..1000; 0 = ignored)
surface_weight = 1

# The mesh the design is compared with may be moved to wherever suits it best.
# (true | false)
move_target = true

# ... and scaled (0.3x .. 3.3x) about its centre of volume.
# (true | false)
scale_target = true

[start]

# The sphere that's carved, mm across, at the mesh's centre of volume.
# (0..100000; 0 = auto: the mesh's volume)
sphere_diameter = 0

[semantic]

# What the views looking different to DINOv3 costs. Needs the model and ONNX Runtime below.
# (0..1000; 0 = off)
semantic_weight = 0

# What the outline comparison costs, beside it. 0: only DINOv3 judges.
# (0..1000; 0 = off)
silhouette_weight = 1

# The .onnx that tools/autodesign/export_dinov3.py writes (it sets the views' size).
# (text)
semantic_model = 

# The ONNX Runtime library (libonnxruntime.so ...). Empty: found as usual.
# (text)
onnx_runtime = 

# Run DINOv3 with CUDA, if this ONNX Runtime has it. Off on a server without a GPU.
# (true | false)
semantic_gpu = false

# How the design and the mesh are drawn for DINOv3.
# (silhouette | depth | shaded)
semantic_look = shaded

# 0: compare the global (CLS) embeddings; 1: the patch embeddings, place by place; between: a mix.
# (0..1)
patch_weight = 0

# Covered pixels whose shading the gradient follows each step.
# (0..1000000)
semantic_samples = 4000

[optimizer]

# Adam steps in all (each one gradient), the rewrites' lookahead included: the budget. (The slider: 100..20000)
# (0..100000000)
steps = 1500

# Adam's step size, in each parameter's own unit. (The slider: 0.05..5)
# (1e-04..100)
learning_rate = 1

# Adam steps between rewrite rounds.
# (1..1000000)
steps_per_round = 60

# Grammar rewrites tried in a round (drawn by the [grammar] weights).
# (0..1000)
rewrites_per_round = 3

# Adam steps every rewrite, and the design without one, get before they are compared.
# (1..100000)
lookahead = 12

# How much better (a share of the loss) a rewrite that adds something must do to be kept; how much worse one that removes may.
# (0..1)
rewrite_margin = 0.005

# Adding a cut makes one more piece: no more than this.
# (2..4096)
max_pieces = 8

# Hollows: material taken out of the sphere without making a piece.
# (0..4096)
max_hollows = 8

# Same seed and settings, same result.
# (0..4294967295)
seed = 1

[grammar]

# How often "add a cut" is drawn for a rewrite (0: never). Adds something: kept when better.
# (0..1000)
add_a_cut = 1

# How often "remove a cut" is drawn for a rewrite (0: never). Takes something away: kept when no worse.
# (0..1000)
remove_a_cut = 0.5

# How often "add a hollow" is drawn for a rewrite (0: never). Adds something: kept when better.
# (0..1000)
add_a_hollow = 0.5

# How often "remove a hollow" is drawn for a rewrite (0: never). Takes something away: kept when no worse.
# (0..1000)
remove_a_hollow = 0.25

[finishing]

# Give every hinge the smallest barrel that prints, when the search is done; the search then keeps each axis where one fits.
# (true | false)
build_hinges = false

# Each axis far enough under the sphere's surface for its barrel to be inside the sphere.
# (true | false)
hinge_flush = true

# Hinge size against the smallest that prints (a 1.6 mm pin in a 3.8 mm barrel). (The slider: 0.75..2.5)
# (0.1..10)
hinge_scale = 1

# mm a piece may be from a hinge's axis and still be joined to it by a leaf that long.
# (0..100; 0 = smallest)
hinge_reach = 0

# mm between the pin and the knuckles around it, and between knuckles.
# (0..10)
hinge_clearance = 0.3

# fused: printed in place. separate: both bored for a pin pushed in afterwards.
# (fused | separate)
hinge_pin = fused

# Carve away whatever still overlaps on the way between open and closed.
# (true | false)
carve_when_done = false

# mm of room left around what is carved away.
# (0..10)
carve_clearance = 0.3

# Poses looked at in every hinge's turn when carving.
# (1..1000)
carve_checks = 32

# Carve, check again between those poses, carve what is left, ... up to this many times.
# (1..100)
carve_rounds = 4

# A press latch on the hinge that opens first.
# (true | false)
latch_when_done = false

# Latch size against the default for the sphere. (The slider: 0.6..1.6)
# (0.1..10)
latch_scale = 1

# mm printed around the rocker.
# (0..10)
latch_clearance = 0.35

[suite]

# The folder of .obj files (suite). Can also be given on the command line.
# (text)
folder = 

# Each mesh is centred and scaled so its longest side is this long, mm.
# (0..100000; 0 = as is)
mesh_size = 80

# Render the video (needs ffmpeg). Off: designs, pictures and summary.csv only.
# (true | false)
video = true

# Pixels, square.
# (256..8192)
video_size = 1080

# Frames per second.
# (1..120)
fps = 30

# Video time for the search (one frame per evenly spaced snapshot).
# (0.1..600)
search_seconds = 8

# Video time for the closing, and again for the opening.
# (0.1..600)
motion_seconds = 2

# Pauses on the result, closed, and open again.
# (0..600)
hold_seconds = 0.6
